<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<title>Finanças</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icone-v2-192.png">
<link rel="apple-touch-icon" href="icone-v2-192.png">
<style>
  html, body { margin:0; height:100%; background:#f4f5f7; }
  @media (prefers-color-scheme: dark) { html, body { background:#0f1115; } }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #aviso { position:fixed; left:16px; right:16px; bottom:24px; display:none; font:14px/1.4 -apple-system, Roboto, sans-serif;
           background:#16181d; color:#fff; padding:14px; border-radius:12px; }
  #aviso a { color:#34c3a0; font-weight:600; }
</style>
</head>
<body>
<!-- Link do App da Web (Implantar > Gerenciar implantações). Ele só abre na sua conta Google. -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzwwesA2NcS_ko0rDi30WlxAV08fHayd0nQaZtDBlTcGv468EMixY5xPwI6XoNZxwo/exec" allow="clipboard-write"></iframe>
<div id="aviso">Não carregou? Entre na sua conta Google no Chrome:
  <a href="https://script.google.com/macros/s/AKfycbzwwesA2NcS_ko0rDi30WlxAV08fHayd0nQaZtDBlTcGv468EMixY5xPwI6XoNZxwo/exec" target="_blank">abrir o app fora</a> uma vez e depois volte aqui.</div>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  // Se em 12 s o app não respondeu, mostra o aviso (geralmente é login do Google).
  let ok = false;
  document.getElementById('app').addEventListener('load', () => { ok = true; });
  setTimeout(() => { if (!ok) document.getElementById('aviso').style.display = 'block'; }, 12000);
</script>
</body>
</html>
